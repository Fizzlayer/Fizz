name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --manifest-path cli/Cargo.toml
      - name: Install dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings --file Cargo.lock
      - run: cargo audit --deny warnings --file cli/Cargo.lock
      - name: Check browser scripts
        run: for script in public/*.js; do node --check "$script"; done
